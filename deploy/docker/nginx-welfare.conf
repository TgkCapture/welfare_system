# nginx site for the welfare app (docs/DEPLOY_VPS.md, step 6).
#
# Replace welfare.example.com with the site's domain, then:
#   Oracle Linux / RHEL:  /etc/nginx/conf.d/welfare.conf
#   Ubuntu / Debian:      /etc/nginx/sites-available/welfare, linked into sites-enabled
# `sudo certbot --nginx -d <domain>` then adds HTTPS and the redirect to it.

server {
    listen 80;
    listen [::]:80;
    server_name welfare.example.com;

    # Workbook uploads (the app allows 16 MB)
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # A Google Sheets sync and report can take a while
        proxy_read_timeout 120s;
    }
}
