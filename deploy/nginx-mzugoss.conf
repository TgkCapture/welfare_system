# nginx site for 3.0.0 on the Oracle server (docs/DEPLOY_VPS.md, step 6).
#
#   sudo cp deploy/nginx-mzugoss.conf /etc/nginx/conf.d/mzugoss.conf
#   (change the server_name if the DuckDNS name differs)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mzugoss.duckdns.org --redirect
#
# certbot then adds the HTTPS server and the redirect to it, as it did for itams.

server {
    listen 80;
    listen [::]:80;
    server_name mzugoss.duckdns.org;

    # Workbook uploads (the app allows 16 MB)
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # A Google Sheets sync and report can take a while
        proxy_read_timeout 120s;
    }
}
