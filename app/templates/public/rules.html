<!-- app/templates/public/rules.html — a group's welfare rules, for its members -->
{% from 'main/_rules.html' import render_sections, rules_styles %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Welfare rules — {{ brand.name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  {% if brand.color != '#1d4ed8' %}<style>:root { --clr-primary: {{ brand.color }}; }</style>{% endif %}
</head>
<body>
  <main class="main-content" style="max-width:52rem;margin:0 auto;padding:1.5rem 1rem;">
    <p class="text-sm text-muted">{{ brand.name }}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
      <h1 class="page-header__title">Welfare rules</h1>
      <a href="{{ url_for('group.rules_pdf', slug=group.slug) }}" class="btn btn--primary btn--sm no-print">
        <i class="fas fa-download"></i> Download PDF
      </a>
    </div>
    {{ render_sections(sections) }}
  </main>
  {{ rules_styles() }}
</body>
</html>
