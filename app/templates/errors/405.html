<!-- app/templates/errors/405.html -->
{% extends 'base.html' %}
{% block title %}Error 405 — Mzugoss Welfare{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-page__code">405</div>
  <div class="error-page__icon">
    <i class="fas fa-hand-paper"></i>
  </div>
  <h1 class="error-page__title">Method Not Allowed</h1>
  <p class="error-page__msg">That HTTP method is not allowed for this endpoint.</p>
  <div class="error-page__actions">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn--primary">
      <i class="fas fa-home"></i> Go to Dashboard
    </a>
    <button onclick="history.back()" class="btn btn--outline">
      <i class="fas fa-arrow-left"></i> Go Back
    </button>
  </div>
</div>
{% endblock %}
