<!-- app/templates/errors/500.html -->
{% extends 'base.html' %}
{% block title %}Error 500 — Mzugoss Welfare{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-page__code">500</div>
  <div class="error-page__icon">
    <i class="fas fa-server"></i>
  </div>
  <h1 class="error-page__title">Server Error</h1>
  <p class="error-page__msg">Something went wrong on our end. Please try again later.</p>
  <div class="error-page__actions">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn--primary">
      <i class="fas fa-home"></i> Go to Dashboard
    </a>
    <button onclick="history.back()" class="btn btn--outline">
      <i class="fas fa-arrow-left"></i> Go Back
    </button>
  </div>
</div>
{% endblock %}
