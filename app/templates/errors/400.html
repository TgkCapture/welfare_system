<!-- app/templates/errors/400.html -->
{% extends 'base.html' %}
{% block title %}Error 400 — Mzugoss Welfare{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-page__code">400</div>
  <div class="error-page__icon">
    <i class="fas fa-exclamation-circle"></i>
  </div>
  <h1 class="error-page__title">Bad Request</h1>
  <p class="error-page__msg">The request could not be understood by the server.</p>
  <div class="error-page__actions">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn--primary">
      <i class="fas fa-home"></i> Go to Dashboard
    </a>
    <button onclick="history.back()" class="btn btn--outline">
      <i class="fas fa-arrow-left"></i> Go Back
    </button>
  </div>
</div>
{% endblock %}
