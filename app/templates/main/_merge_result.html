{# app/templates/main/_merge_result.html — the answer to an in-place merge (htmx) #}
{% if error %}
<div class="text-sm font-semibold">{{ name }}</div>
<p class="form-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
{% else %}
<p class="flex items-center gap-2 text-sm text-emerald-700">
  <i class="fas fa-circle-check"></i>
  <span><strong>{{ name }}</strong> merged into
    <a href="{{ url_for('main.member', member_id=target.id) }}">{{ target.display_name }}</a>.</span>
</p>
{% for note in notes %}<p class="form-hint !text-amber-700">{{ note }}</p>{% endfor %}
{% endif %}
